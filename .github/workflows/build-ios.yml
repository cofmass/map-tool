name: Build iOS Simulator App

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-ios-simulator:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets to iOS
        run: npx cap sync ios

      - name: Build iOS Simulator app
        working-directory: ios/App
        run: >-
          xcodebuild
          -project App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Find and boot iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 'iPhone' | grep -oE '\([0-9A-Fa-f-]{36}\)' | tr -d '()')
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV
          echo "Booting simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          open -a Simulator
          sleep 5

      - name: Install app on simulator
        run: |
          APP_PATH=$(find ios/App/build/Build/Products -name "App.app" -type d | head -1)
          echo "Installing $APP_PATH"
          xcrun simctl install "$SIM_UDID" "$APP_PATH"

      - name: Launch app and take screenshot
        run: |
          xcrun simctl launch "$SIM_UDID" com.maptool.app || true
          sleep 8
          mkdir -p screenshots
          xcrun simctl io "$SIM_UDID" screenshot screenshots/ios-app.png

      - name: Upload screenshot and app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-result
          path: |
            screenshots/*.png
            ios/App/build/Build/Products/Debug-iphonesimulator/App.app
